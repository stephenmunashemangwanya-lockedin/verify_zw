server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  autoindex off;
  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate" always; try_files $uri =404; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache" always; try_files $uri $uri/ /index.html; }
}
