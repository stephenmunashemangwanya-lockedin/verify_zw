openapi: 3.0.3
info:
  title: Zimbabwe Skill Verification Platform API
  version: 1.0.0
  description: API for institution-managed credentials, public verification, blockchain evidence, auditability, and analytics. Examples contain placeholders only. The uploaded PDF is authoritative; a generated PDF is a presentation copy. Credentials become active only after blockchain confirmation, and revoked credentials remain publicly verifiable.
  contact:
    name: API Support
    email: api-support@example.org
  license:
    name: ISC
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.example.org
    description: Production placeholder
tags:
  - { name: Health }
  - { name: Authentication }
  - { name: Users }
  - { name: Institutions }
  - { name: Students }
  - { name: Credentials }
  - { name: Verification }
  - { name: Public Verification }
  - { name: Verification Logs }
  - { name: Audit Logs }
  - { name: Dashboard }
  - { name: QR Codes }
  - { name: Generated Certificates }
  - { name: Blockchain Administration }
  - { name: Documentation }
paths:
  /health:
    get: { tags: [Health], summary: Public liveness check, operationId: publicHealth, responses: { '200': { description: Service is running, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } } } }
  /health/live:
    get: { tags: [Health], summary: Process liveness check, operationId: liveHealth, responses: { '200': { description: Process is alive, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } } } }
  /health/ready:
    get: { tags: [Health], summary: Dependency readiness check, operationId: readyHealth, responses: { '200': { $ref: '#/components/responses/Success' }, '503': { $ref: '#/components/responses/Unavailable' } } }
  /health/database:
    get: { tags: [Health], summary: PostgreSQL health, operationId: databaseHealth, security: [ { BearerAuth: [] } ], x-roles: [super_admin], responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/AuthRequired' }, '403': { $ref: '#/components/responses/AccessDenied' }, '503': { $ref: '#/components/responses/Unavailable' } } }
  /health/ipfs:
    get: { tags: [Health], summary: IPFS provider health, operationId: ipfsHealth, security: [ { BearerAuth: [] } ], x-roles: [super_admin], responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/AuthRequired' }, '403': { $ref: '#/components/responses/AccessDenied' }, '503': { $ref: '#/components/responses/Unavailable' } } }
  /health/blockchain:
    get: { tags: [Health], summary: Blockchain provider health, operationId: blockchainHealth, security: [ { BearerAuth: [] } ], x-roles: [super_admin], responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/AuthRequired' }, '403': { $ref: '#/components/responses/AccessDenied' }, '503': { $ref: '#/components/responses/Unavailable' } } }
  /metrics:
    get: { tags: [Health], summary: Protected Prometheus metrics, operationId: metrics, security: [ { BearerAuth: [] } ], x-roles: [super_admin], responses: { '200': { description: Prometheus text exposition }, '401': { $ref: '#/components/responses/AuthRequired' }, '403': { $ref: '#/components/responses/AccessDenied' }, '404': { $ref: '#/components/responses/NotFound' } } }
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Public account registration policy response
      description: Self-registration is disabled because all implemented non-global roles require an approved institution. Public credential verification does not require an account.
      operationId: register
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterInput' } } } }
      responses: { '403': { $ref: '#/components/responses/AccessDenied' }, '400': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } }
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate and establish a secure browser session
      description: Sets an HttpOnly authentication cookie and a non-secret CSRF proof. Failed attempts may trigger temporary account lockout. A bearer token is returned only when explicit API-client compatibility is enabled.
      operationId: login
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginInput' } } } }
      responses: { '200': { description: Login successful, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }, '400': { $ref: '#/components/responses/ValidationError' }, '401': { $ref: '#/components/responses/InvalidCredentials' }, '403': { $ref: '#/components/responses/AccessDenied' }, '423': { $ref: '#/components/responses/Locked' }, '429': { $ref: '#/components/responses/RateLimited' } }
  /api/auth/logout:
    post: { tags: [Authentication], summary: Audit logout and clear authentication cookies, operationId: logout, security: [ { BearerAuth: [] } ], responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/AuthRequired' }, '403': { $ref: '#/components/responses/AccessDenied' } } }
  /api/auth/forgot-password:
    post: { tags: [Authentication], summary: Request password recovery instructions, description: Always returns the same response for eligible, unknown, and inactive accounts. Stores only a SHA-256 token hash and is independently rate limited., operationId: forgotPassword, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ForgotPasswordInput' } } } }, responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } } }
  /api/auth/reset-password:
    post: { tags: [Authentication], summary: Consume a single-use password reset token, description: Does not establish a session. Successful use revokes existing sessions and clears account lock state., operationId: resetPassword, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResetPasswordInput' } } } }, responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/ValidationError' }, '409': { $ref: '#/components/responses/Conflict' }, '429': { $ref: '#/components/responses/RateLimited' } } }
  /api/auth/profile:
    get: { tags: [Authentication], summary: Current safe user profile, operationId: profile, security: [ { BearerAuth: [] } ], responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/AuthRequired' } } }
    patch: { tags: [Authentication], summary: Update current name or email, operationId: updateProfile, security: [ { BearerAuth: [] } ], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileInput' } } } }, responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/ValidationError' }, '401': { $ref: '#/components/responses/AuthRequired' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /api/auth/change-password:
    post: { tags: [Authentication], summary: Change current password and invalidate existing tokens, operationId: changePassword, security: [ { BearerAuth: [] } ], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChangePasswordInput' } } } }, responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/ValidationError' }, '401': { $ref: '#/components/responses/AuthRequired' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /api/auth/admin-only:
    get: { tags: [Authentication], summary: Administrative authorization probe, operationId: adminOnly, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin], responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/AuthRequired' }, '403': { $ref: '#/components/responses/AccessDenied' } } }
  /api/users:
    get: { tags: [Users], summary: List users with server pagination, operationId: listUsers, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin], parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/SortOrder' }, { name: sortBy, in: query, schema: { type: string, enum: [created_at, updated_at, full_name, email, role, is_active] } }, { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }, { name: status, in: query, schema: { type: string, enum: [active, inactive, 'true', 'false'] } }, { name: institutionId, in: query, schema: { type: string, format: uuid } } ], responses: { '200': { $ref: '#/components/responses/Paginated' }, '400': { $ref: '#/components/responses/ValidationError' }, '401': { $ref: '#/components/responses/AuthRequired' }, '403': { $ref: '#/components/responses/AccessDenied' } } }
    post: { tags: [Users], summary: Create a managed user, operationId: createUser, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserInput' } } } }, responses: { '201': { $ref: '#/components/responses/Created' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/AccessDenied' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /api/users/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get: { tags: [Users], summary: Get a safe user record, operationId: getUser, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin], responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/AccessDenied' }, '404': { $ref: '#/components/responses/NotFound' } } }
    patch: { tags: [Users], summary: Update user name or email, operationId: updateUser, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileInput' } } } }, responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/AccessDenied' }, '404': { $ref: '#/components/responses/NotFound' } } }
  /api/users/{id}/status:
    patch: { tags: [Users], summary: Activate or deactivate user, operationId: changeUserStatus, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin], parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [isActive], properties: { isActive: { type: boolean } }, additionalProperties: false } } } }, responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/AccessDenied' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /api/users/{id}/role:
    patch: { tags: [Users], summary: Change user role, operationId: changeUserRole, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin], parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [role], properties: { role: { $ref: '#/components/schemas/Role' } }, additionalProperties: false } } } }, responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/AccessDenied' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /api/users/{id}/institution:
    patch: { tags: [Users], summary: Assign user institution, operationId: assignUserInstitution, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin], parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [institutionId], properties: { institutionId: { type: string, format: uuid } }, additionalProperties: false } } } }, responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/AccessDenied' }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /api/users/{id}/reset-password:
    post: { tags: [Users], summary: Initiate managed password reset, description: Stores only a reset-token hash and requests delivery through the configured secure channel. No password or token is returned., operationId: resetUserPassword, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin], parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { content: { application/json: { schema: { type: object, additionalProperties: false } } } }, responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/AccessDenied' }, '429': { $ref: '#/components/responses/RateLimited' } } }
  /api/users/{id}/unlock:
    post: { tags: [Users], summary: Clear an authorized user's account lock, description: Clears failed-login and lock state without changing the password or creating a session., operationId: unlockUser, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin], parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { content: { application/json: { schema: { type: object, additionalProperties: false } } } }, responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/AccessDenied' }, '404': { $ref: '#/components/responses/NotFound' } } }
  /api/users/{id}/require-password-change:
    post: { tags: [Users], summary: Require a password change and invalidate sessions, operationId: requireUserPasswordChange, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin], parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { content: { application/json: { schema: { type: object, additionalProperties: false } } } }, responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/AccessDenied' }, '404': { $ref: '#/components/responses/NotFound' } } }
  /api/institutions:
    get: { tags: [Institutions], summary: List institutions, operationId: listInstitutions, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin, issuer, verifier], parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/SortOrder' }, { name: sortBy, in: query, schema: { type: string, enum: [created_at, name, email, status] } }, { name: status, in: query, schema: { type: string, enum: [active, inactive, 'true', 'false'] } } ], responses: { '200': { $ref: '#/components/responses/Paginated' }, '400': { $ref: '#/components/responses/ValidationError' } } }
    post: { tags: [Institutions], summary: Create institution, operationId: createInstitution, security: [ { BearerAuth: [] } ], x-roles: [super_admin], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InstitutionInput' } } } }, responses: { '201': { $ref: '#/components/responses/Created' }, '400': { $ref: '#/components/responses/ValidationError' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /api/institutions/{id}:
    get: { tags: [Institutions], summary: Get institution, operationId: getInstitution, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin, issuer, verifier], parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/NotFound' } } }
  /api/institutions/{id}/status:
    patch: { tags: [Institutions], summary: Activate or deactivate institution, operationId: institutionStatus, security: [ { BearerAuth: [] } ], x-roles: [super_admin], parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: boolean } }, additionalProperties: false } } } }, responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/NotFound' } } }
  /api/institutions/{id}/blockchain/authorise:
    post: { tags: [Blockchain Administration], summary: Authorise institution wallet on-chain, operationId: authoriseInstitution, security: [ { BearerAuth: [] } ], x-roles: [super_admin], parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { $ref: '#/components/responses/Success' }, '422': { $ref: '#/components/responses/ValidationError' }, '503': { $ref: '#/components/responses/Unavailable' } } }
  /api/institutions/{id}/blockchain/deactivate:
    post: { tags: [Blockchain Administration], summary: Deactivate institution wallet on-chain, operationId: deactivateInstitution, security: [ { BearerAuth: [] } ], x-roles: [super_admin], parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { $ref: '#/components/responses/Success' }, '503': { $ref: '#/components/responses/Unavailable' } } }
  /api/students:
    get: { tags: [Students], summary: List institution-scoped students, operationId: listStudents, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin, issuer, verifier], parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/SortOrder' }, { name: sortBy, in: query, schema: { type: string, enum: [created_at, student_number, full_name, programme] } }, { name: institutionId, in: query, schema: { type: string, format: uuid } }, { name: programme, in: query, schema: { type: string, maxLength: 200 } } ], responses: { '200': { $ref: '#/components/responses/Paginated' }, '403': { $ref: '#/components/responses/AccessDenied' } } }
    post: { tags: [Students], summary: Create student, operationId: createStudent, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin, issuer], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StudentInput' } } } }, responses: { '201': { $ref: '#/components/responses/Created' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/AccessDenied' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /api/students/{id}:
    get: { tags: [Students], summary: Get institution-scoped student, operationId: getStudent, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin, issuer, verifier], parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/AccessDenied' }, '404': { $ref: '#/components/responses/NotFound' } } }
    patch: { tags: [Students], summary: Update institution-scoped student identity, operationId: updateStudent, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin, issuer], parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StudentUpdateInput' } } } }, responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/AccessDenied' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /api/students/{id}/institution:
    patch: { tags: [Students], summary: Reassign a credential-free student, description: Super-admin only. Rejected when any credential references the student; credentials are never moved or rewritten., operationId: reassignStudentInstitution, security: [ { BearerAuth: [] } ], x-roles: [super_admin], parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [institutionId], properties: { institutionId: { type: string, format: uuid } }, additionalProperties: false } } } }, responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/AccessDenied' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /api/students/{id}/account:
    post: { tags: [Students], summary: Link an existing student account to a student record, description: Server-enforced one-to-one link. The account must have role student, be active, and belong to the student's institution. Institution administrators may link only within their own institution., operationId: linkStudentAccount, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin], parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [userId], properties: { userId: { type: string, format: uuid } }, additionalProperties: false } } } }, responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/AccessDenied' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /api/credentials:
    get: { tags: [Credentials], summary: List institution-scoped credentials, operationId: listCredentials, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin, issuer, verifier], parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/SortOrder' }, { name: sortBy, in: query, schema: { type: string, enum: [created_at, updated_at, issue_date, qualification, status] } }, { name: status, in: query, schema: { $ref: '#/components/schemas/CredentialStatus' } }, { name: institutionId, in: query, schema: { type: string, format: uuid } }, { name: studentId, in: query, schema: { type: string, format: uuid } }, { name: issueDateFrom, in: query, schema: { type: string, format: date } }, { name: issueDateTo, in: query, schema: { type: string, format: date } } ], responses: { '200': { $ref: '#/components/responses/Paginated' }, '403': { $ref: '#/components/responses/AccessDenied' } } }
  /api/credentials/me:
    get: { tags: [Credentials], summary: List credentials owned by the authenticated student, description: The server resolves the linked student profile from the authenticated account; client-supplied student identifiers are not used for ownership., operationId: listMyCredentials, security: [ { BearerAuth: [] } ], x-roles: [student], parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { name: status, in: query, schema: { $ref: '#/components/schemas/CredentialStatus' } } ], responses: { '200': { $ref: '#/components/responses/Paginated' }, '401': { $ref: '#/components/responses/AuthRequired' }, '403': { $ref: '#/components/responses/AccessDenied' } } }
  /api/credentials/{id}:
    get: { tags: [Credentials], summary: Get credential and evidence, operationId: getCredential, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin, issuer, verifier, student], parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/AccessDenied' }, '404': { $ref: '#/components/responses/NotFound' } } }
  /api/credentials/issue:
    post:
      tags: [Credentials]
      summary: Issue a credential from an authoritative PDF
      description: Validates PDF bytes, hashes the original, uploads to IPFS, confirms the blockchain transaction, then activates the credential. Duplicate hashes return 409. Provider failures leave a controlled failed-processing status.
      operationId: issueCredential
      security: [ { BearerAuth: [] } ]
      x-roles: [super_admin, institution_admin, issuer]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [certificate, studentId, institutionId, qualification, issueDate], properties: { certificate: { type: string, format: binary, description: PDF only; default maximum 10 MB }, studentId: { type: string, format: uuid }, institutionId: { type: string, format: uuid }, qualification: { type: string, minLength: 2, maxLength: 300 }, issueDate: { type: string, format: date } } } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/AccessDenied' }, '409': { $ref: '#/components/responses/Conflict' }, '413': { $ref: '#/components/responses/FileTooLarge' }, '422': { $ref: '#/components/responses/ValidationError' }, '503': { $ref: '#/components/responses/Unavailable' }, '504': { $ref: '#/components/responses/Unavailable' } }
  /api/credentials/{id}/revoke:
    patch: { tags: [Credentials], summary: Permanently revoke credential with blockchain confirmation, operationId: revokeCredential, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin], parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 5, maxLength: 1000 } }, additionalProperties: false } } } }, responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/AccessDenied' }, '409': { $ref: '#/components/responses/Conflict' }, '503': { $ref: '#/components/responses/Unavailable' } } }
  /api/credentials/{id}/supersede:
    patch: { tags: [Credentials], summary: Supersede an active credential with an active corrected replacement, description: Preserves the original credential and links it to a same-student same-institution replacement credential., operationId: supersedeCredential, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin, issuer], parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [replacementCredentialId, reason], properties: { replacementCredentialId: { type: string, format: uuid }, reason: { type: string, minLength: 5, maxLength: 1000 } }, additionalProperties: false } } } }, responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/AccessDenied' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /api/credentials/{id}/generate-pdf:
    post: { tags: [Generated Certificates], summary: Generate a presentation certificate, description: The generated PDF is a presentation copy; the originally uploaded PDF remains authoritative., operationId: generateCredentialPdf, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin, issuer], parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/AccessDenied' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /api/credentials/{id}/pdf:
    get: { tags: [Generated Certificates], summary: Download the generated presentation PDF, description: Streams only the server-generated presentation copy as an attachment. The original uploaded PDF remains authoritative in IPFS and no server path is exposed., operationId: downloadCredentialPdf, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin, issuer, verifier, student], parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Presentation PDF attachment, headers: { Content-Disposition: { schema: { type: string }, description: Fixed safe attachment filename } }, content: { application/pdf: { schema: { type: string, format: binary } } } }, '403': { $ref: '#/components/responses/AccessDenied' }, '404': { $ref: '#/components/responses/NotFound' } } }
  /api/verify/file:
    post: { tags: [Verification], summary: Public verification of an uploaded PDF, operationId: verifyFile, requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [certificate], properties: { certificate: { type: string, format: binary, description: PDF only; default maximum 10 MB }, verifierName: { type: string, maxLength: 150 }, verifierEmail: { type: string, format: email } } } } } }, responses: { '200': { $ref: '#/components/responses/Verification' }, '400': { $ref: '#/components/responses/ValidationError' }, '413': { $ref: '#/components/responses/FileTooLarge' }, '422': { $ref: '#/components/responses/InvalidFile' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/Unavailable' } } }
  /api/verify/hash/{hash}:
    get: { tags: [Verification], summary: Public verification by SHA-256 hash, operationId: verifyHash, parameters: [ { name: hash, in: path, required: true, schema: { type: string, pattern: '^(0x)?[a-fA-F0-9]{64}$' } } ], responses: { '200': { $ref: '#/components/responses/Verification' }, '400': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/Unavailable' } } }
  /api/verify/credential/{id}:
    get: { tags: [Verification], summary: Public verification by credential UUID, operationId: verifyCredentialId, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { $ref: '#/components/responses/Verification' }, '400': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } } }
  /api/verify/credential/{id}/file:
    post: { tags: [Verification], summary: Verify an uploaded PDF against a claimed credential UUID, description: Hashes the supplied PDF and compares it with the claimed credential before applying the normal verification trust checks., operationId: verifyClaimedCredentialFile, parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [certificate], properties: { certificate: { type: string, format: binary, description: PDF only; default maximum 10 MB }, verifierName: { type: string, maxLength: 150 }, verifierEmail: { type: string, format: email } } } } } }, responses: { '200': { $ref: '#/components/responses/Verification' }, '400': { $ref: '#/components/responses/ValidationError' }, '413': { $ref: '#/components/responses/FileTooLarge' }, '422': { $ref: '#/components/responses/InvalidFile' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/Unavailable' } } }
  /api/verify/token/{publicToken}:
    get: { tags: [Verification, QR Codes], summary: Public token and QR destination verification, operationId: verifyPublicToken, parameters: [ { name: publicToken, in: path, required: true, schema: { type: string, format: uuid } } ], responses: { '200': { $ref: '#/components/responses/Verification' }, '400': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' } } }
  /api/verify/token/{publicToken}/file:
    post: { tags: [Verification, QR Codes], summary: Verify an uploaded PDF against a claimed public credential token, description: Hashes the supplied PDF and compares it with the credential referenced by the public token before applying the normal verification trust checks., operationId: verifyClaimedPublicTokenFile, parameters: [ { name: publicToken, in: path, required: true, schema: { type: string, format: uuid } } ], requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [certificate], properties: { certificate: { type: string, format: binary, description: PDF only; default maximum 10 MB }, verifierName: { type: string, maxLength: 150 }, verifierEmail: { type: string, format: email } } } } } }, responses: { '200': { $ref: '#/components/responses/Verification' }, '400': { $ref: '#/components/responses/ValidationError' }, '413': { $ref: '#/components/responses/FileTooLarge' }, '422': { $ref: '#/components/responses/InvalidFile' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/Unavailable' } } }
  /api/verification-logs:
    get: { tags: [Verification Logs], summary: List institution-scoped verification events, description: Verifier identity, user agent, and network metadata are protected administrative data., operationId: listVerificationLogs, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin], parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/SortOrder' }, { name: sortBy, in: query, schema: { type: string, enum: [verification_time, result, verification_method] } }, { name: result, in: query, schema: { $ref: '#/components/schemas/VerificationResult' } }, { name: method, in: query, schema: { type: string, enum: [file, hash, credential_id, public_token, qr] } }, { name: credentialId, in: query, schema: { type: string, format: uuid } }, { name: institutionId, in: query, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/DateFrom' }, { $ref: '#/components/parameters/DateTo' } ], responses: { '200': { $ref: '#/components/responses/Paginated' }, '403': { $ref: '#/components/responses/AccessDenied' } } }
  /api/audit-logs:
    get: { tags: [Audit Logs], summary: List scoped audit records, operationId: listAuditLogs, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin], parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/SortOrder' }, { name: sortBy, in: query, schema: { type: string, enum: [action, entity_type, created_at] } }, { name: action, in: query, schema: { type: string } }, { name: entityType, in: query, schema: { type: string } }, { name: entityId, in: query, schema: { type: string, format: uuid } }, { name: userId, in: query, schema: { type: string, format: uuid } }, { name: institutionId, in: query, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/DateFrom' }, { $ref: '#/components/parameters/DateTo' } ], responses: { '200': { $ref: '#/components/responses/Paginated' }, '403': { $ref: '#/components/responses/AccessDenied' } } }
  /api/audit-logs/{id}:
    get: { tags: [Audit Logs], summary: Get one scoped sanitized audit record, operationId: getAuditLog, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin], parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/AccessDenied' }, '404': { $ref: '#/components/responses/NotFound' } } }
  /api/dashboard/summary:
    get: { tags: [Dashboard], summary: Role-aware summary metrics, description: Non-super users are institution scoped. Verifiers receive verification metrics only., operationId: dashboardSummary, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin, issuer, verifier], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /api/dashboard/recent-activity:
    get: { tags: [Dashboard], summary: Sanitized recent activity, operationId: recentActivity, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin, issuer], parameters: [ { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }, { name: action, in: query, schema: { type: string, maxLength: 100 } }, { name: entityType, in: query, schema: { type: string, maxLength: 100 } } ], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /api/dashboard/credential-trends:
    get: { tags: [Dashboard], summary: Credential lifecycle trends, operationId: credentialTrends, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin, issuer], parameters: [ { $ref: '#/components/parameters/Period' }, { $ref: '#/components/parameters/GroupBy' }, { $ref: '#/components/parameters/DateFrom' }, { $ref: '#/components/parameters/DateTo' } ], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /api/dashboard/verification-trends:
    get: { tags: [Dashboard], summary: Verification result trends, operationId: verificationTrends, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin, issuer, verifier], parameters: [ { $ref: '#/components/parameters/Period' }, { $ref: '#/components/parameters/GroupBy' }, { $ref: '#/components/parameters/DateFrom' }, { $ref: '#/components/parameters/DateTo' }, { name: method, in: query, schema: { type: string, enum: [file, hash, credential_id, public_token, qr] } } ], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /api/dashboard/top-institutions:
    get: { tags: [Dashboard], summary: Platform institution ranking, description: Super-admin-only platform aggregate., operationId: topInstitutions, security: [ { BearerAuth: [] } ], x-roles: [super_admin], parameters: [ { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }, { $ref: '#/components/parameters/DateFrom' }, { $ref: '#/components/parameters/DateTo' }, { name: sortBy, in: query, schema: { type: string, enum: [totalCredentials, activeCredentials, totalVerifications, totalStudents] } } ], responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/AccessDenied' } } }
  /api/dashboard/most-verified-credentials:
    get: { tags: [Dashboard], summary: Most verified credentials without hashes or tokens, operationId: mostVerified, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin, issuer, verifier], parameters: [ { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }, { $ref: '#/components/parameters/DateFrom' }, { $ref: '#/components/parameters/DateTo' }, { name: status, in: query, schema: { $ref: '#/components/schemas/CredentialStatus' } } ], responses: { '200': { $ref: '#/components/responses/Success' } } }
  /api/dashboard/failures:
    get: { tags: [Dashboard], summary: Sanitized controlled failure analytics, description: Provider errors and processing-error text are not returned., operationId: failureAnalytics, security: [ { BearerAuth: [] } ], x-roles: [super_admin, institution_admin, issuer], parameters: [ { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/DateFrom' }, { $ref: '#/components/parameters/DateTo' }, { name: category, in: query, schema: { type: string, enum: [ipfs, blockchain, certificate_processing, pdf_generation, reconciliation, verification_inconsistency, account_lockout] } } ], responses: { '200': { $ref: '#/components/responses/Paginated' } } }
  /api/dashboard/system-health:
    get: { tags: [Dashboard], summary: Provider health and reconciliation metrics, description: Super-admin-only; secrets, RPC URLs, and provider internals are excluded., operationId: dashboardHealth, security: [ { BearerAuth: [] } ], x-roles: [super_admin], responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/AccessDenied' } } }
  /api/docs:
    get: { tags: [Documentation], summary: Swagger UI, description: Enabled by default in development. In production set ENABLE_SWAGGER=true and preferably SWAGGER_REQUIRE_AUTH=true., operationId: swaggerUi, responses: { '200': { description: Swagger UI HTML }, '401': { $ref: '#/components/responses/AuthRequired' }, '403': { $ref: '#/components/responses/AccessDenied' }, '404': { $ref: '#/components/responses/NotFound' }, '503': { $ref: '#/components/responses/Unavailable' } } }
  /api/docs/openapi.yaml:
    get: { tags: [Documentation], summary: Raw OpenAPI specification, operationId: rawOpenApi, responses: { '200': { description: OpenAPI YAML, content: { application/yaml: { schema: { type: string } } } }, '401': { $ref: '#/components/responses/AuthRequired' }, '403': { $ref: '#/components/responses/AccessDenied' }, '404': { $ref: '#/components/responses/NotFound' }, '503': { $ref: '#/components/responses/Unavailable' } } }
components:
  securitySchemes:
    BearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    CookieAuth: { type: apiKey, in: cookie, name: verifyzw_session, description: HttpOnly browser session cookie; cookie-authenticated unsafe requests also require X-CSRF-Token. }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Search: { name: search, in: query, schema: { type: string, maxLength: 200 } }
    SortOrder: { name: sortOrder, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
    DateFrom: { name: dateFrom, in: query, schema: { type: string, format: date } }
    DateTo: { name: dateTo, in: query, schema: { type: string, format: date } }
    Period: { name: period, in: query, schema: { type: string, enum: [7days, 30days, 3months, 6months, 12months], default: 30days } }
    GroupBy: { name: groupBy, in: query, schema: { type: string, enum: [day, week, month], default: day } }
  schemas:
    Role: { type: string, enum: [super_admin, institution_admin, issuer, verifier, student] }
    CredentialStatus: { type: string, enum: [pending, processing, active, failed, revoked] }
    VerificationResult: { type: string, enum: [VERIFIED, REVOKED, UNKNOWN, PENDING, FAILED, SYSTEM_INCONSISTENCY, INVALID_FILE] }
    Health: { type: object, required: [status], properties: { status: { type: string, example: healthy } } }
    StandardError: { type: object, required: [success, message], properties: { success: { type: boolean, enum: [false] }, code: { type: string, example: ACCESS_DENIED }, message: { type: string, example: You do not have permission to perform this action. }, requestId: { type: string, format: uuid, nullable: true } } }
    ValidationError: { allOf: [ { $ref: '#/components/schemas/StandardError' }, { type: object, properties: { code: { type: string, enum: [VALIDATION_ERROR] }, errors: { type: array, items: { type: object, required: [field, message], properties: { field: { type: string, example: email }, message: { type: string, example: A valid email address is required. } } } } } } ] }
    Pagination: { type: object, required: [page, limit, total, totalPages, hasNextPage, hasPreviousPage], properties: { page: { type: integer }, limit: { type: integer }, total: { type: integer }, totalPages: { type: integer }, hasNextPage: { type: boolean }, hasPreviousPage: { type: boolean } } }
    RegisterInput: { type: object, required: [fullName, email, password], properties: { fullName: { type: string, minLength: 2, maxLength: 150 }, email: { type: string, format: email }, password: { type: string, format: password, example: '<PASSWORD>' }, role: { type: string, enum: [verifier] } }, additionalProperties: false }
    LoginInput: { type: object, required: [email, password], properties: { email: { type: string, format: email, example: admin@example.org }, password: { type: string, format: password, example: '<PASSWORD>' } }, additionalProperties: false }
    ForgotPasswordInput: { type: object, required: [email], properties: { email: { type: string, format: email, example: user@example.org } }, additionalProperties: false }
    ResetPasswordInput: { type: object, required: [token, password, confirmPassword], properties: { token: { type: string, minLength: 43, example: '<PASSWORD_RESET_TOKEN>' }, password: { type: string, format: password, minLength: 12, example: '<NEW_STRONG_PASSWORD>' }, confirmPassword: { type: string, format: password, minLength: 12, example: '<NEW_STRONG_PASSWORD>' } }, additionalProperties: false }
    LoginResponse: { type: object, properties: { success: { type: boolean, enum: [true] }, message: { type: string }, token: { type: string, description: Present only when explicit API-client bearer compatibility is enabled, example: '<BEARER_TOKEN>' }, user: { $ref: '#/components/schemas/User' } } }
    ProfileInput: { type: object, minProperties: 1, properties: { fullName: { type: string, minLength: 2, maxLength: 150 }, email: { type: string, format: email } }, additionalProperties: false }
    ChangePasswordInput: { type: object, required: [currentPassword, newPassword, confirmPassword], properties: { currentPassword: { type: string, format: password, example: '<CURRENT_PASSWORD>' }, newPassword: { type: string, format: password, example: '<NEW_STRONG_PASSWORD>' }, confirmPassword: { type: string, format: password, example: '<NEW_STRONG_PASSWORD>' } }, additionalProperties: false }
    User: { type: object, properties: { id: { type: string, format: uuid }, fullName: { type: string }, email: { type: string, format: email }, role: { $ref: '#/components/schemas/Role' }, institutionId: { type: string, format: uuid, nullable: true }, isActive: { type: boolean }, mustChangePassword: { type: boolean } } }
    UserInput: { type: object, required: [fullName, email, role], properties: { fullName: { type: string, minLength: 2, maxLength: 150 }, email: { type: string, format: email }, role: { $ref: '#/components/schemas/Role' }, institutionId: { type: string, format: uuid, nullable: true }, isActive: { type: boolean } }, additionalProperties: false }
    InstitutionInput: { type: object, required: [name, walletAddress, email], properties: { name: { type: string, minLength: 2, maxLength: 200 }, walletAddress: { type: string, pattern: '^0x[a-fA-F0-9]{40}$', example: '<EVM_WALLET_ADDRESS>' }, email: { type: string, format: email }, phone: { type: string, maxLength: 30 } }, additionalProperties: false }
    StudentInput: { type: object, required: [studentNumber, fullName, programme, institutionId], properties: { studentNumber: { type: string, maxLength: 80 }, fullName: { type: string, minLength: 2, maxLength: 150 }, email: { type: string, format: email }, programme: { type: string, minLength: 2, maxLength: 200 }, institutionId: { type: string, format: uuid } }, additionalProperties: false }
    StudentUpdateInput: { type: object, required: [studentNumber, fullName, programme], properties: { studentNumber: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*$', maxLength: 80 }, fullName: { type: string, minLength: 2, maxLength: 150 }, email: { type: string, format: email, nullable: true }, programme: { type: string, minLength: 2, maxLength: 200 } }, additionalProperties: false }
    VerificationData: { type: object, properties: { outcome: { $ref: '#/components/schemas/VerificationResult' }, credential: { type: object, additionalProperties: true }, blockchain: { type: object, additionalProperties: true } }, additionalProperties: true }
    StandardSuccessResponse: { type: object, required: [success], properties: { success: { type: boolean, enum: [true] }, message: { type: string }, requestId: { type: string, format: uuid, nullable: true } }, additionalProperties: true }
    StandardErrorResponse: { $ref: '#/components/schemas/StandardError' }
    ValidationErrorResponse: { $ref: '#/components/schemas/ValidationError' }
    PaginationMetadata: { $ref: '#/components/schemas/Pagination' }
    SafeUserProfile: { $ref: '#/components/schemas/User' }
    Institution: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string }, walletAddress: { type: string }, email: { type: string, format: email }, phone: { type: string, nullable: true }, status: { type: boolean }, blockchainAuthorised: { type: boolean } } }
    Student: { type: object, properties: { id: { type: string, format: uuid }, studentNumber: { type: string }, fullName: { type: string }, email: { type: string, format: email, nullable: true }, programme: { type: string }, institutionId: { type: string, format: uuid } } }
    Credential: { type: object, properties: { id: { type: string, format: uuid }, studentId: { type: string, format: uuid }, institutionId: { type: string, format: uuid }, qualification: { type: string }, issueDate: { type: string, format: date }, certificateHash: { type: string }, ipfsCid: { type: string }, blockchainTx: { type: string }, blockchainNetwork: { type: string }, blockNumber: { type: integer }, status: { $ref: '#/components/schemas/CredentialStatus' }, publicToken: { type: string, format: uuid }, revokedAt: { type: string, format: date-time, nullable: true } } }
    VerificationLog: { type: object, properties: { id: { type: string, format: uuid }, credentialId: { type: string, format: uuid, nullable: true }, result: { $ref: '#/components/schemas/VerificationResult' }, verificationMethod: { $ref: '#/components/schemas/VerificationMethod' }, verificationTime: { type: string, format: date-time } } }
    AuditLog: { type: object, properties: { id: { type: string, format: uuid }, userId: { type: string, format: uuid, nullable: true }, action: { type: string }, entityType: { type: string }, entityId: { type: string, format: uuid, nullable: true }, details: { type: object, additionalProperties: true }, createdAt: { type: string, format: date-time } } }
    DashboardSummary: { type: object, additionalProperties: { type: integer }, description: Role-shaped counts; fields vary by permitted metrics. }
    DashboardTrendPoint: { type: object, properties: { period: { type: string }, total: { type: integer } }, additionalProperties: { type: integer } }
    SystemHealth: { type: object, properties: { status: { type: string, enum: [healthy, degraded, unavailable] }, database: { type: object, additionalProperties: true }, ipfs: { type: object, additionalProperties: true }, blockchain: { type: object, additionalProperties: true }, reconciliation: { type: object, additionalProperties: true } } }
    QRCodeResponse: { type: object, properties: { publicToken: { type: string, format: uuid }, verificationUrl: { type: string, format: uri }, qrCodePath: { type: string } } }
    GeneratedCertificateResponse: { type: object, properties: { filename: { type: string }, verificationUrl: { type: string, format: uri }, status: { $ref: '#/components/schemas/CredentialStatus' } } }
    VerificationMethod: { type: string, enum: [file, hash, credential_id, public_token, qr] }
  responses:
    Success: { description: Successful operation, content: { application/json: { schema: { type: object, required: [success], properties: { success: { type: boolean, enum: [true] } }, additionalProperties: true } } } }
    Created: { description: Resource created, content: { application/json: { schema: { type: object, required: [success], properties: { success: { type: boolean, enum: [true] } }, additionalProperties: true } } } }
    Paginated: { description: Paginated result; non-super-admin results are institution scoped where applicable, content: { application/json: { schema: { type: object, required: [success, pagination], properties: { success: { type: boolean, enum: [true] }, pagination: { $ref: '#/components/schemas/Pagination' } }, additionalProperties: true } } } }
    Verification:
      description: Controlled public verification outcome
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { type: boolean, enum: [true] }
              data: { $ref: '#/components/schemas/VerificationData' }
    ValidationError: { description: Request validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
    AuthRequired: { description: Missing, expired, stale, or invalid bearer token, content: { application/json: { schema: { $ref: '#/components/schemas/StandardError' } } } }
    InvalidCredentials: { description: Invalid email or password, content: { application/json: { schema: { $ref: '#/components/schemas/StandardError' } } } }
    AccessDenied: { description: Authenticated actor lacks permission or institution scope, content: { application/json: { schema: { $ref: '#/components/schemas/StandardError' } } } }
    Locked: { description: Account temporarily locked, content: { application/json: { schema: { $ref: '#/components/schemas/StandardError' } } } }
    NotFound: { description: Resource not found or feature disabled, content: { application/json: { schema: { $ref: '#/components/schemas/StandardError' } } } }
