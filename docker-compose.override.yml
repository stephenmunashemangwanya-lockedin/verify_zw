services:
  backend:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ./backend:/app/backend
      - ./scripts/startDockerBackend.js:/app/scripts/startDockerBackend.js:ro
      - ./docs/openapi.yaml:/app/docs/openapi.yaml:ro
  frontend:
    build:
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api}
