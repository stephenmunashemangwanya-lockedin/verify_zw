name: Docker Images

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24.7.0

jobs:
  compose-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      POSTGRES_DB: skill_verification_ci_test
      POSTGRES_USER: ci_runner
      POSTGRES_PASSWORD: ci-fake-postgres-password
      TEST_POSTGRES_PASSWORD: ci-fake-test-password
      JWT_SECRET: ci-placeholder-jwt-secret-at-least-24-characters
      BLOCKCHAIN_ENABLED: "false"
      BLOCKCHAIN_NETWORK: staging-placeholder
      BLOCKCHAIN_RPC_URL: https://rpc.invalid.example
      BLOCKCHAIN_CHAIN_ID: 11155111
      CONTRACT_ADDRESS: "0x1111111111111111111111111111111111111111"
      DEPLOYER_PRIVATE_KEY: "0x1111111111111111111111111111111111111111111111111111111111111111"
    steps:
      - uses: actions/checkout@v6.0.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: docker compose --profile local --profile tools config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet
      - run: docker compose -f docker-compose.test.yml config --quiet
      - run: npm run test:docker
      - name: Create ephemeral fake Docker environment
        run: |
          printf '%s\n' \
            'POSTGRES_DB=skill_verification_ci_test' \
            'POSTGRES_USER=ci_runner' \
            'POSTGRES_PASSWORD=ci-fake-postgres-password' \
            'TEST_POSTGRES_PASSWORD=ci-fake-test-password' \
            'JWT_SECRET=ci-placeholder-jwt-secret-at-least-24-characters' \
            'BLOCKCHAIN_ENABLED=false' > .env.docker
      - run: npm run docker:test

  build-scan-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: Dockerfile
          - component: frontend
            dockerfile: frontend/Dockerfile
          - component: blockchain
            dockerfile: docker/blockchain.Dockerfile
          - component: backup
            dockerfile: docker/backup.Dockerfile
    steps:
      - uses: actions/checkout@v6.0.2
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@v4.0.0
      - name: Build local validation image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: stage27-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ hashFiles('package-lock.json', 'frontend/package-lock.json') }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ hashFiles('package-lock.json', 'frontend/package-lock.json') }}
      - name: Report image size
        run: docker image inspect stage27-${{ matrix.component }}:${{ github.sha }} --format '${{ matrix.component }} {{.Size}} bytes'
      - name: Scan image vulnerabilities and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: stage27-${{ matrix.component }}:${{ github.sha }}
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate SPDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: stage27-${{ matrix.component }}:${{ github.sha }}
          format: spdx-json
          output: sbom-${{ matrix.component }}.spdx.json
          scanners: vuln
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom-${{ matrix.component }}-${{ github.sha }}
          path: sbom-${{ matrix.component }}.spdx.json
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request' && github.event.repository.fork == false
    needs: [compose-and-integration, build-scan-sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: backend
            dockerfile: Dockerfile
          - component: frontend
            dockerfile: frontend/Dockerfile
          - component: blockchain
            dockerfile: docker/blockchain.Dockerfile
          - component: backup
            dockerfile: docker/backup.Dockerfile
    steps:
      - uses: actions/checkout@v6.0.2
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@v4.0.0
      - uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject an existing immutable semantic-version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}-${{ matrix.component }}:${GITHUB_REF_NAME}"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "Immutable image tag already exists: $image" >&2
            exit 1
          fi
      - uses: docker/metadata-action@v6.0.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ hashFiles('package-lock.json', 'frontend/package-lock.json') }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ hashFiles('package-lock.json', 'frontend/package-lock.json') }}
